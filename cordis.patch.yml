# dsh-deepseek-chat bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with `dsh plugin --profile web add dsh-deepseek-chat`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs in
# the host process (/deepseek-chat/* routes on the shared webserver, streaming
# through the user's configured `deepseek-official` llm route), and the
# `dsh.client` declaration in package.json makes the browser half
# (exports "./client", served at /plugins/deepseek-chat/client.js) load in the
# web GUI.
- insert:
    - id: deepseek-chat
      name: 'dsh-deepseek-chat'
